name: Gramchat
options:
  bundleIdPrefix: uz.example
  deploymentTarget:
    iOS: "16.0"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.70-03220f6b
targets:
  Gramchat:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: TDLibKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.example.gramchat
        PRODUCT_NAME: Gramchat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
